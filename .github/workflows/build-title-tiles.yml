name: Build title boundary tiles

# Builds the on-demand title-lookup tile set (see
# docs/TITLE_BOUNDARY_API_PLAN.md) and publishes it as GitHub Release
# assets. Replaces the old sync-title-boundaries-{ew,scotland}.yml design,
# which upserted the whole national dataset into Postgres — this workflow
# never touches Postgres and needs no Supabase secret at all.
#
# Both build scripts write into one shared directory as
# <nation>/<shardId>.json.gz (scripts/lib/titleTiles.mjs's
# appendParcelsToTiles layout). Release assets can't hold subdirectories
# and must be named exactly <nation>_<shardId>.json.gz — the exact
# filename supabase/functions/lookup-title-boundary/index.ts requests —
# so the "flatten" step below copies each file into a per-nation
# directory with that prefix before upload, rather than uploading the
# raw tree directly.
#
# Real incident (20 Oct 2026): shards were originally a 5x5 block of
# fine cells (~128 files total, comfortably under GitHub's 1,000-asset
# cap), but a real shard checked directly turned out to be 186MB
# decompressed - decompressing just ONE on every lookup cost ~2.1s of
# CPU time, the entire budget Supabase's Edge Functions allow per
# request (hard-capped, not configurable on the hosted platform). First
# shrunk to a 2x2 block, published as two per-nation releases - which
# fixed the TYPICAL case but not the real worst one: measured directly
# against that rebuilt data, the densest England & Wales shard (central
# London) still took ~5.6s to decompress, and the worst Scotland shard
# took ~16s - for a completely different reason (see
# scripts/lib/titleTiles.mjs's writeParcelsToShardParts: a title
# registered as hundreds of disjoint scattered parts was being tagged,
# whole, into every fine cell across its combined bounding box, not just
# the cells actually near each part).
#
# Real fix, same day: FINE_CELLS_PER_SHARD dropped to 1 (no grouping at
# all - a shard IS a fine cell), writeParcelsToShardParts now tags and
# simplifies per RING rather than per whole parcel, and - because that
# alone would quadruple the per-nation file count again, past the
# 1,000-asset cap on its own this time - each nation's release split
# further, into NUM_RELEASE_PARTITIONS (3) releases instead of 1. Real
# measurement against the actual rebuilt data after all three changes:
# the same worst London fine cell dropped to ~62MB decompressed (~0.9s),
# and the same worst Scotland shard-area's content dropped by roughly
# 17x once split per fine cell (worst individual cell ~7MB, trivially
# fast) - both comfortably under the 2s budget with real margin, not
# just the typical case this time.
on:
  schedule:
    # Both source registries publish at most quarterly (HMLR ~monthly,
    # RoS quarterly) — run on the 8th of Jan/Apr/Jul/Oct (04:00 UTC), a day
    # after both sync workflows' own publish-buffer days, so a from-scratch
    # tile rebuild always starts from each source's latest data.
    - cron: '0 4 8 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse and log, write/publish nothing)'
        type: boolean
        default: false
      council:
        description: 'England & Wales: only this council (substring match), for verification ONLY — never publishes, leave blank for a real --all build'
        type: string
        default: ''
      county:
        description: 'Scotland: only this Registration County (substring match), for verification ONLY — never publishes, leave blank for a real --all build'
        type: string
        default: ''

permissions:
  contents: write # to create/replace the title-tiles-latest release and its assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~380 councils + 33 counties, one fetch + parse each — same budget as the two sync workflows combined
    env:
      OUT_DIR: ./title-tiles-build
      ASSETS_DIR: ./title-tiles-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Real incident (20 Oct 2026): a real --all run built and finalized
      # every shard correctly (2,291 EW + 1,630 Scotland files), but
      # Publish failed partway through the 4th of 6 releases with "HTTP
      # 403: API rate limit exceeded for installation" - the default
      # GITHUB_TOKEN's own rate limit (undocumented exact figure, but
      # empirically well under the ~3,900 release-asset-upload calls
      # NUM_RELEASE_PARTITIONS x 2 nations now needs) ran out partway
      # through. A real user-owned PAT gets the much higher standard
      # 5,000/hour authenticated-user limit instead, comfortably covering
      # this. Checked HERE, before the ~2-hour build, rather than letting
      # a real --all run spend that time only to fail at Publish again.
      - name: Verify the release-publish PAT is configured
        if: inputs.dry_run != 'true' && inputs.council == '' && inputs.county == ''
        env:
          HAS_PAT: ${{ secrets.TITLE_TILES_RELEASE_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "TITLE_TILES_RELEASE_PAT repo secret is not set. The default GITHUB_TOKEN's own rate limit isn't enough to publish NUM_RELEASE_PARTITIONS x 2 nations' worth of individual release-asset uploads (3,900+ calls) - confirmed by a real run hitting '403 API rate limit exceeded for installation' partway through. See docs/SETUP.md §15 (in the jamspr95/stopspotter repo) for how to create a fine-grained PAT (Contents: Read & Write, scoped to only this repo) and add it here as this secret." >&2
            exit 1
          fi

      # continue-on-error: a handful of per-council failures (a transient
      # fetch blip, one outlier council too large to parse — see below)
      # are close to GUARANTEED on every real --all run against 318
      # councils, and treating any of them as fatal to the whole job
      # means the pipeline can never publish anything, ever, defeating
      # the point. The trailing "Fail the job" step below still turns
      # the job red when this happens, so it stays visible — it just no
      # longer blocks the 97%+ of real data that DID parse from shipping.
      #
      # Real incident (Oct 2026): `ARGS="--council=${{ inputs.council }}"`
      # then `node ... $ARGS ...` left $ARGS UNQUOTED, so bash word-split
      # a multi-word council name. `--council=The North Yorkshire` became
      # three separate argv entries; the build script only read the
      # first (`--council=The`), giving a filter of just "The", which
      # substring-matches almost every council name with "the" in it
      # (Carmarthenshire, Rotherham, Southend-on-Sea, ...) — not the one
      # council actually asked for. That run's output still got published
      # (see the Publish step's own incident note below), replacing the
      # live release with only those ~8 unrelated areas' tiles and making
      # "no known owner" wrong almost everywhere else in the country.
      # Fixed by passing the filter via an env var and double-quoting
      # every expansion, so a multi-word value survives as one argument.
      - name: Build England & Wales tiles
        id: build_ew
        continue-on-error: true
        env:
          COUNCIL_FILTER: ${{ inputs.council }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--all)
          if [ -n "$COUNCIL_FILTER" ]; then
            ARGS=(--council="$COUNCIL_FILTER")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          node scripts/build-title-tiles-ew.mjs "${ARGS[@]}" --out="$OUT_DIR"

      - name: Build Scotland tiles
        id: build_scotland
        continue-on-error: true
        env:
          COUNTY_FILTER: ${{ inputs.county }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--all)
          if [ -n "$COUNTY_FILTER" ]; then
            ARGS=(--county="$COUNTY_FILTER")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          node scripts/build-title-tiles-scotland.mjs "${ARGS[@]}" --out="$OUT_DIR"

      # Real incident (Oct 2026, same run as above): a SCOPED run (council
      # and/or county filter set — meant only to verify a fix against one
      # or two known-problem areas) still ran Flatten+Publish, which
      # unconditionally deletes and recreates title-tiles-latest from
      # whatever's in $OUT_DIR — i.e. ONLY that scoped run's handful of
      # areas. It replaced the full 316/32-area release with ~29 shards.
      # A scoped run can now only ever inspect/log; it never reaches
      # Publish. Only a true --all run (both filters blank) may publish.
      # NUM_PARTITIONS must stay identical to scripts/lib/titleTiles.mjs's
      # NUM_RELEASE_PARTITIONS / releasePartitionForShardId - same reasoning
      # as FINE_CELLS_PER_SHARD being duplicated between this repo and
      # supabase/functions/lookup-title-boundary/index.ts's copy: this is
      # bash, that's JS/TS, so it's a copy, not an import, but the actual
      # formula (latBucket mod partition count) must match exactly or a
      # shard would get published to one partition's release while the
      # edge function looks for it in another.
      - name: Flatten shards into per-nation, per-partition <nation>_<shardId>.json.gz release assets
        if: inputs.dry_run != 'true' && inputs.council == '' && inputs.county == ''
        run: |
          set -euo pipefail
          NUM_PARTITIONS=3
          for nation in england_wales scotland; do
            for p in $(seq 0 $((NUM_PARTITIONS - 1))); do
              mkdir -p "$ASSETS_DIR/$nation/$p"
            done
          done
          shopt -s nullglob
          for nation_dir in "$OUT_DIR"/*/; do
            nation="$(basename "$nation_dir")"
            for f in "$nation_dir"*.json.gz; do
              base="$(basename "$f" .json.gz)"
              lat="${base%%_*}"
              partition=$(( ((lat % NUM_PARTITIONS) + NUM_PARTITIONS) % NUM_PARTITIONS ))
              cp "$f" "$ASSETS_DIR/$nation/$partition/${nation}_$(basename "$f")"
            done
          done
          total=0
          for nation in england_wales scotland; do
            for p in $(seq 0 $((NUM_PARTITIONS - 1))); do
              count=$(find "$ASSETS_DIR/$nation/$p" -name '*.json.gz' | wc -l)
              echo "Flattened $count $nation partition $p shard asset(s)."
              total=$((total + count))
            done
          done
          if [ "$total" -eq 0 ]; then
            echo "No shard files were produced by either build script — refusing to publish an empty release." >&2
            exit 1
          fi

      # GitHub Releases cap out at 1000 assets per release (confirmed against
      # GitHub's own docs, Oct 2026) — checked per nation PER PARTITION,
      # since each partition now publishes to its own release (see this
      # workflow's own top-of-file comment for why: FINE_CELLS_PER_SHARD
      # dropped to 1 - no grouping at all - which on its own would have
      # quadrupled the single-release-per-nation file count straight past
      # this cap). Kept as a loud failure rather than a silent truncated
      # publish if the real count ever drifts past this again; if it
      # fires, the fix is a larger NUM_RELEASE_PARTITIONS (in both this
      # repo's copy and supabase/functions/lookup-title-boundary/index.ts's
      # duplicate), not a workaround here.
      - name: Check asset counts against GitHub's per-release limit
        if: inputs.dry_run != 'true' && inputs.council == '' && inputs.county == ''
        run: |
          NUM_PARTITIONS=3
          for nation in england_wales scotland; do
            for p in $(seq 0 $((NUM_PARTITIONS - 1))); do
              count=$(find "$ASSETS_DIR/$nation/$p" -name '*.json.gz' 2>/dev/null | wc -l)
              echo "$nation partition $p: $count shard asset(s) to publish."
              if [ "$count" -gt 950 ]; then
                echo "$nation partition $p's $count assets would exceed (or come dangerously close to) GitHub's documented 1000-asset-per-release limit." >&2
                exit 1
              fi
            done
          done

      # gh release create takes a list of asset files/patterns and relies on
      # the CALLING SHELL to expand any glob in them (confirmed against the
      # installed gh CLI's own --help: "USAGE gh release create [<tag>]
      # [<filename>... | <pattern>...]", with its own example
      # `gh release create v1.2.3 ./dist/*.tgz` left unquoted) — it does not
      # itself walk directories or expand `**`. $ASSETS_DIR/<nation>/<p>/*.json.gz
      # is a flat, single-level glob (no subdirectories by this point, see
      # the flatten step above), so plain bash globbing is enough; no
      # globstar needed.
      #
      # NUM_RELEASE_PARTITIONS releases per nation (title-tiles-latest-ew-0/1/2,
      # title-tiles-latest-scotland-0/1/2) — not one release per nation — so
      # each stays comfortably under GitHub's 1,000-asset cap on its own
      # (see this workflow's top-of-file comment). The edge function
      # computes the same latBucket-mod-partition-count formula to pick
      # which release to fetch from.
      # TITLE_TILES_RELEASE_PAT, not the default GITHUB_TOKEN — see the
      # "Verify the release-publish PAT is configured" step's own comment
      # for the real incident (403 rate-limit) that made the default
      # token insufficient here.
      - name: Publish releases (replaces every title-tiles-latest-{ew,scotland}-N entirely)
        if: inputs.dry_run != 'true' && inputs.council == '' && inputs.county == ''
        env:
          GITHUB_TOKEN: ${{ secrets.TITLE_TILES_RELEASE_PAT }}
        run: |
          set -euo pipefail
          NUM_PARTITIONS=3

          # Real incident (20 Oct 2026): the first version of this retry
          # swallowed `gh release delete`'s result with `|| true`,
          # reasoning that a failure just meant "didn't exist yet". A
          # real run proved that wrong: delete hit a transient
          # `HTTP 502: Server Error` on an existing release, got silently
          # ignored, and every one of the 5 retries then failed `create`
          # with "a release with the same tag name already exists" -
          # the actual problem (delete didn't work) never got retried at
          # all, just the symptom. Fixed by giving delete its own
          # verified retry loop (gh release view confirms it's actually
          # gone, not just that the delete command returned 0) before
          # ever attempting create.
          delete_release_if_exists() {
            local tag="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if ! gh release view "$tag" >/dev/null 2>&1; then
                return 0 # confirmed gone (or never existed) - safe to create
              fi
              gh release delete "$tag" --yes || true
              sleep $((attempt * 15))
            done
            if ! gh release view "$tag" >/dev/null 2>&1; then
              return 0
            fi
            echo "Could not confirm $tag was deleted after 5 attempts." >&2
            return 1
          }

          publish_one_release() {
            local tag="$1" title="$2"
            shift 2
            local assets=("$@")
            local attempt
            for attempt in 1 2 3 4 5; do
              if delete_release_if_exists "$tag" && gh release create "$tag" "${assets[@]}" --title "$title" --notes "Built $(date -u +%Y-%m-%d)"; then
                return 0
              fi
              echo "Publishing $tag failed (attempt $attempt/5) - waiting $((attempt * 60))s before retrying, in case this was a transient rate limit or server error." >&2
              sleep $((attempt * 60))
            done
            echo "Giving up on $tag after 5 attempts." >&2
            return 1
          }

          # any_failed tracked rather than letting `set -e` abort the whole
          # step on the first exhausted-retries release — one release
          # genuinely failing (distinct from the OTHER 5 succeeding) should
          # still let the rest publish, same "ship what worked, fail loudly
          # rather than silently" shape as the per-council build failures
          # below. Checked, then surfaced as a real exit code at the end.
          any_failed=0
          for nation_tag in england_wales:ew scotland:scotland; do
            nation="${nation_tag%%:*}"
            tagsuffix="${nation_tag#*:}"
            for p in $(seq 0 $((NUM_PARTITIONS - 1))); do
              tag="title-tiles-latest-${tagsuffix}-${p}"
              assets=("$ASSETS_DIR/$nation/$p"/*.json.gz)
              if [ ! -e "${assets[0]}" ]; then
                echo "No $nation partition $p shards produced - leaving $tag untouched rather than publishing it empty." >&2
                continue
              fi
              publish_one_release "$tag" "Title boundary tiles — $nation (partition $p)" "${assets[@]}" || any_failed=1
            done
          done
          if [ "$any_failed" -eq 1 ]; then
            echo "One or more releases failed to publish - see above for which. Any OTHER release that succeeded is still live; re-run this workflow to retry just the ones that didn't." >&2
            exit 1
          fi

      - name: Scoped run — not publishing
        if: inputs.dry_run != 'true' && (inputs.council != '' || inputs.county != '')
        run: |
          echo "council/county filter was set, so this run is verification-only — the live title-tiles-latest-{ew,scotland} releases were NOT touched. Run with both left blank to publish a real --all build." >&2

      # Surfaces a per-council failure as a red job (so it's never
      # silently missed) without having blocked the publish step above
      # from shipping whatever DID parse correctly. Deliberately runs
      # last — after Publish, not instead of it.
      - name: Fail the job if either nation had per-council build errors
        if: steps.build_ew.outcome == 'failure' || steps.build_scotland.outcome == 'failure'
        run: |
          echo "One or both build steps above failed to parse some councils/counties — see their own logs for which ones and why. The release was still published with everything that DID parse correctly; this failure is just to make sure the gap doesn't go unnoticed." >&2
          exit 1
